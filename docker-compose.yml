# CopyNCE Descriptor：平行于 SSCD 的多副本 gRPC 拓扑（独立端口，不共用 nginx）。
# SSCD 占用 59990/59991+；本服务使用 59890/59891+。
# Matcher 不在此部署。

services:
  desc1:
    build: .
    image: copynce-descriptor:latest
    restart: always
    ports:
      - "59891:50051"
    environment:
      - COPYNCE_WEIGHTS=/weights/descriptor_vits_224.pth.tar
      - COPYNCE_DEVICE=cuda:0
      - COPYNCE_IMAGE_SIZE=224
      - COPYNCE_BATCH_SIZE=16
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - ./weights:/weights:ro
    logging:
      driver: json-file
      options:
        max-size: "1G"
        max-file: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  desc2:
    build: .
    image: copynce-descriptor:latest
    restart: always
    ports:
      - "59892:50051"
    environment:
      - COPYNCE_WEIGHTS=/weights/descriptor_vits_224.pth.tar
      - COPYNCE_DEVICE=cuda:0
      - COPYNCE_IMAGE_SIZE=224
      - COPYNCE_BATCH_SIZE=16
      - NVIDIA_VISIBLE_DEVICES=1
    volumes:
      - ./weights:/weights:ro
    logging:
      driver: json-file
      options:
        max-size: "1G"
        max-file: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  desc3:
    build: .
    image: copynce-descriptor:latest
    restart: always
    ports:
      - "59893:50051"
    environment:
      - COPYNCE_WEIGHTS=/weights/descriptor_vits_224.pth.tar
      - COPYNCE_DEVICE=cuda:0
      - COPYNCE_IMAGE_SIZE=224
      - COPYNCE_BATCH_SIZE=16
      - NVIDIA_VISIBLE_DEVICES=2
    volumes:
      - ./weights:/weights:ro
    logging:
      driver: json-file
      options:
        max-size: "1G"
        max-file: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]

  nginx:
    image: nginx:1.25-alpine
    restart: always
    depends_on:
      - desc1
      - desc2
      - desc3
    ports:
      - "59890:59890"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "100M"
        max-file: "3"
