worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Docker Compose 内网：upstream 用服务名。
    # 若 nginx 跑在宿主机，改用 nginx.host.conf（127.0.0.1:59891+）。
    upstream copynce_descriptor_pool {
        server desc1:50051;
        server desc2:50051;
        server desc3:50051;
    }

    server {
        listen 59890;
        http2 on;

        location / {
            grpc_pass grpc://copynce_descriptor_pool;

            grpc_connect_timeout 5s;
            grpc_read_timeout 1h;
            grpc_send_timeout 1h;
        }
    }
}
