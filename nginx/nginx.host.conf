# 宿主机 nginx 示例（对齐 jhf/sscd/nginx 用法）：
#   不走 compose 的 nginx 服务时，把本文件拷到宿主机 nginx 配置并改 IP。
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream copynce_descriptor_pool {
        server 127.0.0.1:59891;
        server 127.0.0.1:59892;
        server 127.0.0.1:59893;
    }

    server {
        listen 59890;
        http2 on;

        location / {
            grpc_pass grpc://copynce_descriptor_pool;

            grpc_connect_timeout 5s;
            grpc_read_timeout 1h;
            grpc_send_timeout 1h;
        }
    }
}
